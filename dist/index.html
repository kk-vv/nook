<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NOOKVOID — digital artist and onchain creator." />
    <meta name="theme-color" content="#070707" />
    <title>NOOKVOID</title>
    <link rel="icon" type="image/png" href="./assets/avatar.png?v=3" />
    <link rel="apple-touch-icon" href="./assets/avatar.png?v=3" />
    <link rel="stylesheet" href="./styles.css?v=11" />
    <script type="module" src="./script.js?v=8"></script>
  </head>
  <body>
    <canvas class="signal-field" data-signal-field aria-hidden="true"></canvas>

    <main class="page">
      <section class="profile" aria-labelledby="profile-name">
        <div class="profile-body">
          <a
            class="profile-avatar"
            href="https://opensea.io/item/ethereum/0x9b7a60e76f59037d152adbbafa8c6db591b274ac/300580"
            target="_blank"
            rel="noreferrer"
            aria-label="View NOOKVOID avatar NFT on OpenSea"
          >
            <svg
              class="avatar-hex"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 132 152"
              role="img"
              aria-label="NOOKVOID avatar NFT"
            >
              <defs>
                <linearGradient id="avatar-border" x1="14" y1="132" x2="118" y2="19" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#31d57c" />
                  <stop offset=".31" stop-color="#2f8cff" />
                  <stop offset=".55" stop-color="#8267ff" />
                  <stop offset=".77" stop-color="#ee506b" />
                  <stop offset="1" stop-color="#f3b928" />
                </linearGradient>
                <clipPath id="avatar-clip">
                  <path d="M66 4c3 0 5.2.7 7.4 2l48.4 28c4.1 2.4 6.2 5.8 6.2 10.6v62.8c0 4.8-2.1 8.2-6.2 10.6l-48.4 28c-4.6 2.6-10.2 2.6-14.8 0l-48.4-28C6.1 115.6 4 112.2 4 107.4V44.6c0-4.8 2.1-8.2 6.2-10.6L58.6 6C60.8 4.7 63 4 66 4Z" />
                </clipPath>
              </defs>
              <path
                fill="url(#avatar-border)"
                d="M66 0c3.8 0 6.5.8 9.2 2.4l49.6 28.7c4.9 2.8 7.2 7 7.2 12.7v64.4c0 5.7-2.3 9.9-7.2 12.7l-49.6 28.7c-5.8 3.2-12.6 3.2-18.4 0L7.2 120.9C2.3 118.1 0 113.9 0 108.2V43.8c0-5.7 2.3-9.9 7.2-12.7L56.8 2.4C59.5.8 62.2 0 66 0Z"
              />
              <foreignObject x="4" y="4" width="124" height="144" clip-path="url(#avatar-clip)">
                <picture xmlns="http://www.w3.org/1999/xhtml" class="avatar-picture">
                  <source srcset="./assets/avatar.avif" type="image/avif" />
                  <img src="./assets/avatar.png" alt="" />
                </picture>
              </foreignObject>
            </svg>
          </a>

          <h1 id="profile-name">NOOKVOID</h1>

          <nav class="profile-links" aria-label="Profile links">
            <a
              href="https://x.com/nookvoid"
              target="_blank"
              rel="noreferrer"
              aria-label="NOOKVOID on X"
              title="X"
            >
              <img class="brand-icon brand-icon-x" src="./assets/x-official.svg" alt="" />
            </a>
            <a
              href="https://opensea.io/nookstore"
              target="_blank"
              rel="noreferrer"
              aria-label="nookstore on OpenSea"
              title="OpenSea"
            >
              <img class="brand-icon brand-icon-opensea" src="./assets/opensea-official-white.svg" alt="" />
            </a>
            <a
              href="https://opensea.io/ens/nookvoid.eth"
              target="_blank"
              rel="noreferrer"
              aria-label="View nookvoid.eth on OpenSea"
              title="nookvoid.eth"
            >
              <img class="brand-icon brand-icon-eth" src="./assets/ethereum.svg" alt="" />
            </a>
            <a href="mailto:vivid3799@gmail.com" aria-label="Email NOOKVOID" title="Email">
              <img class="brand-icon brand-icon-mail" src="./assets/mail.svg" alt="" />
            </a>
          </nav>
        </div>
      </section>

      <section class="projects" aria-labelledby="projects-title">
        <div class="section-heading">
          <h2 id="projects-title">Projects</h2>
        </div>

        <div class="project-grid">
          <article class="project-card">
            <a
              class="project-image project-image-grid"
              href="https://opensea.io/collection/grid-skull"
              target="_blank"
              rel="noreferrer"
              aria-label="View Grid Skull on OpenSea"
            >
              <picture>
                <source srcset="./assets/grid-skull.avif" type="image/avif" />
                <img src="./assets/grid-skull.png" alt="Grid Skull NFT preview" />
              </picture>
            </a>

            <div class="project-info">
              <div>
                <h3>Grid Skull</h3>
                <p>Gold &amp; Silver</p>
              </div>
              <div class="project-links">
                <a
                  href="https://opensea.io/collection/grid-skull"
                  target="_blank"
                  rel="noreferrer"
                  aria-label="Grid Skull on OpenSea"
                >
                  <img src="./assets/opensea-official-white.svg" alt="" />
                  <span>OpenSea</span>
                </a>
              </div>
            </div>
          </article>

          <article class="project-card">
            <a
              class="project-image project-image-buddy"
              href="https://claudenft.com"
              target="_blank"
              rel="noreferrer"
              aria-label="Visit Code Buddy"
            >
              <img src="./assets/codebuddy-454.svg" alt="CodeBuddy NFT #454 Rabbit" />
            </a>

            <div class="project-info">
              <div>
                <h3>Code Buddy</h3>
                <p>Code Buddy NFT</p>
              </div>
              <div class="project-links">
                <a
                  href="https://opensea.io/collection/claude-code-buddy"
                  target="_blank"
                  rel="noreferrer"
                  aria-label="Code Buddy on OpenSea"
                >
                  <img src="./assets/opensea-official-white.svg" alt="" />
                  <span>OpenSea</span>
                </a>
                <a
                  href="https://claudenft.com"
                  target="_blank"
                  rel="noreferrer"
                  aria-label="Code Buddy website"
                >
                  <img src="./assets/web.svg" alt="" />
                  <span>Website</span>
                </a>
              </div>
            </div>
          </article>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p>© <span data-year>2026</span> NOOKVOID</p>
      <p>All rights reserved.</p>
    </footer>
  </body>
</html>
